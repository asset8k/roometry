[project]
name = "roometry"
version = "0.1.0"
description = "AI 3D Room Optimization Agent"
readme = "README.md"
authors = [
    { name = "Asset", email = "asset8k@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.143.3",
    "jsonschema>=4.26,<5",
    "langgraph>=1.2.16,<1.3",
    "mcp>=2.1,<3",
    "openai>=2,<3",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.3,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]
